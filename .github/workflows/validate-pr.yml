name: Validação de Contribuições (Pull Request)

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  validate-content:
    name: 🌿 Validação do Acervo e Metadados
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Instalar Dependências Python
        run: pip install -r requirements.txt

      - name: Validar Integridade dos Verbetes e Mídias
        run: python3 scripts/validate_contribution.py

      - name: Executar Testes de Validação (pytest)
        run: pytest

  build-check:
    name: 🏗️ Testes e Compilação Web (Astro & Pagefind)
    runs-on: ubuntu-latest
    needs: validate-content
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package.json

      - name: Instalar Dependências Web
        run: cd web && npm ci

      - name: Executar Testes Unitários de Conteúdo e Componentes
        run: cd web && npm test

      - name: Compilar Astro e Gerar Índices Pagefind
        run: cd web && npm run build

      - name: Validar Busca Pagefind em Runtime
        run: cd web && npm test
